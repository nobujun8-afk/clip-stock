<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>クリップストック</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16a34a">
<style>
  :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --sub:#64748b; --line:#e2e8f0; --accent:#16a34a; --chip:#f1f5f9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --line:#334155; --chip:#334155; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--accent); color:#fff; padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; display:flex; align-items:center; gap:8px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header button { background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:8px; padding:6px 10px; font-size:13px; }
  main { max-width:720px; margin:0 auto; padding:12px 16px 80px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  input, select, textarea { width:100%; font-size:16px; padding:9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  textarea { min-height:56px; }
  label { display:block; font-size:12px; color:var(--sub); margin:8px 0 4px; }
  .primary { width:100%; margin-top:10px; padding:11px; font-size:16px; font-weight:600; background:var(--accent); color:#fff; border:0; border-radius:8px; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; }
  .chip { flex:none; border:1px solid var(--line); background:var(--chip); color:var(--text); border-radius:999px; padding:6px 12px; font-size:14px; }
  .cats { display:flex; flex-wrap:wrap; gap:6px; }
  .catEdit { margin-top:8px; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row { display:flex; gap:8px; align-items:center; }
  .clip .meta { font-size:12px; color:var(--sub); }
  .clip .memo { margin:6px 0; white-space:pre-wrap; }
  .badge { display:inline-block; font-size:12px; background:var(--chip); border-radius:6px; padding:2px 8px; margin-right:4px; }
  .actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .actions button, .actions a { font-size:13px; border:1px solid var(--line); background:transparent; color:var(--text); border-radius:8px; padding:6px 10px; text-decoration:none; }
  .watched { opacity:.6; }
  .empty { text-align:center; color:var(--sub); padding:40px 0; }
  .note { font-size:12px; color:var(--sub); }
  .embed { margin-top:8px; }
  .preview { display:flex; gap:10px; margin:8px 0; cursor:pointer; }
  .thumb { flex:none; width:96px; height:96px; border-radius:8px; background:var(--chip) center/cover no-repeat; position:relative; }
  .thumb::after { content:"▶"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; text-shadow:0 0 6px rgba(0,0,0,.7); }
  .preview .author { font-size:13px; font-weight:600; }
  .preview .author span { font-weight:400; color:var(--sub); }
  .preview .text { font-size:14px; margin-top:2px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
</style>
</head>
<body>
<header>
  <h1>⚽ クリップストック</h1>
  <span id="mode" class="note" style="color:#dcfce7"></span>
  <button id="authBtn" hidden></button>
</header>
<main>
  <button id="openForm" type="button" class="primary" style="margin:0 0 12px">＋ URL を貼ってクリップを追加</button>
  <form id="addForm" class="card" hidden>
    <label for="url">X / Instagram / YouTube のリンク</label>
    <input id="url" type="url" placeholder="https://x.com/.../status/..." required>
    <button type="button" id="pasteBtn" style="margin-top:8px">📋 コピーしたリンクを貼る</button>
    <label>分類</label>
    <div id="category" class="cats"></div>
    <div>
      <div>
        <label for="tags">タグ（スペース区切り）</label>
        <input id="tags" placeholder="U-12 守備">
        <div id="tagSuggest" class="chips" style="padding-top:6px"></div>
      </div>
    </div>
    <label for="memo">メモ</label>
    <textarea id="memo" placeholder="例：火曜の練習で使えそう"></textarea>
    <button class="primary" type="submit">保存</button>
    <button id="closeForm" type="button" class="primary" style="background:transparent;color:var(--sub);font-weight:400;margin-top:4px">閉じる</button>
  </form>

  <input id="search" type="search" placeholder="メモ・タグ・投稿の本文で検索" style="margin-bottom:8px">
  <div id="filters" class="chips"></div>
  <div id="list"></div>
</main>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";

const CATEGORIES = ["練習メニュー", "戦術", "個人技術", "身体操作", "その他"];
const $ = (id) => document.getElementById(id);
let clips = [];
let filter = "すべて";
let store;

// ---- 保存先：Firebase（同期）または localStorage（この端末のみ） ----
const localStore = {
  key: "clipstock",
  load() { try { return JSON.parse(localStorage.getItem(this.key)) || []; } catch { return []; } },
  save(all) { try { localStorage.setItem(this.key, JSON.stringify(all)); } catch {} },
  subscribe(cb) { cb(this.load()); },
  async add(c) { const all = [{ id: crypto.randomUUID(), ...c }, ...this.load()]; this.save(all); render(clips = all); },
  async update(id, patch) { const all = this.load().map((c) => c.id === id ? { ...c, ...patch } : c); this.save(all); render(clips = all); },
  async remove(id) { const all = this.load().filter((c) => c.id !== id); this.save(all); render(clips = all); },
};

async function firebaseStore() {
  const v = "10.12.2";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
  const auth = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`);
  const app = initializeApp(firebaseConfig);
  const a = auth.getAuth(app);
  const db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache() });
  let col, unsub;
  const btn = $("authBtn");
  btn.hidden = false;
  return {
    subscribe(cb) {
      auth.onAuthStateChanged(a, (user) => {
        unsub?.();
        btn.textContent = user ? "ログアウト" : "Googleでログイン";
        btn.onclick = () => user ? auth.signOut(a) : auth.signInWithPopup(a, new auth.GoogleAuthProvider());
        if (!user) { col = null; cb([]); $("list").innerHTML = '<p class="empty">右上からログインすると、iPhone と PC で同期されます</p>'; return; }
        col = fs.collection(db, "users", user.uid, "clips");
        unsub = fs.onSnapshot(fs.query(col, fs.orderBy("createdAt", "desc")), (snap) =>
          cb(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
      });
    },
    async add(c) { if (!col) return alert("先にログインしてください"); await fs.addDoc(col, c); },
    async update(id, patch) { await fs.updateDoc(fs.doc(col, id), patch); },
    async remove(id) { await fs.deleteDoc(fs.doc(col, id)); },
  };
}

// ---- 画面 ----
const isInstagram = (url) => url.includes("instagram.com/");
// YouTube の動画 ID を取り出す（通常の動画・youtu.be の短縮・ショート・ライブ）
function youtubeId(raw) {
  const m = String(raw).match(/https?:\/\/(?:(?:www\.|m\.|music\.)?youtube\.com\/(?:watch\?(?:[^#\s]*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}
const isYoutube = (url) => /youtube\.com\/|youtu\.be\//.test(url);
function normalizeUrl(raw) {
  const yt = youtubeId(raw);
  if (yt) return `https://www.youtube.com/watch?v=${yt}`;
  // Instagram の投稿・リール（共有用の ?igsh= などは捨てて、投稿の ID だけ残す）
  const ig = String(raw).match(/https?:\/\/(?:www\.)?instagram\.com\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([\w-]+)/);
  if (ig) return `https://www.instagram.com/${ig[1] === "p" ? "p" : "reel"}/${ig[2]}/`;
  const m = String(raw).match(/https?:\/\/(?:www\.|mobile\.)?(?:x|twitter)\.com\/([^/?#]+)\/status\/(\d+)/);
  return m ? `https://x.com/${m[1]}/status/${m[2]}` : null;
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// ---- 分類ボタン・タグ候補（保存フォーム） ----
let selectedCategory = CATEGORIES[0];
const parseTags = (text) => [...new Set(text.split(/[\s　,、]+/).filter(Boolean))];

function renderCategoryButtons() {
  $("category").innerHTML = CATEGORIES.map((n) =>
    `<button type="button" class="chip ${n === selectedCategory ? "on" : ""}" data-cat="${n}">${n}</button>`).join("");
}
$("category").addEventListener("click", (e) => {
  if (e.target.dataset.cat) { selectedCategory = e.target.dataset.cat; renderCategoryButtons(); }
});

// これまでに使ったタグを、よく使う順にボタンで出す（押すとタグ欄に追加）
function renderTagSuggest() {
  const count = {};
  clips.forEach((c) => (c.tags || []).forEach((t) => { count[t] = (count[t] || 0) + 1; }));
  const current = parseTags($("tags").value);
  $("tagSuggest").innerHTML = Object.keys(count).filter((t) => !current.includes(t))
    .sort((a, b) => count[b] - count[a]).slice(0, 15)
    .map((t) => `<button type="button" class="chip" data-tag="${esc(t)}">#${esc(t)}</button>`).join("");
}
$("tagSuggest").addEventListener("click", (e) => {
  const t = e.target.dataset.tag;
  if (!t) return;
  $("tags").value = [...parseTags($("tags").value), t].join(" ");
  renderTagSuggest();
});
$("tags").addEventListener("input", renderTagSuggest);

function renderFilters() {
  const names = ["すべて", ...CATEGORIES, "未視聴"];
  $("filters").innerHTML = names.map((n) => {
    const count = n === "すべて" ? clips.length : n === "未視聴" ? clips.filter((c) => !c.watched).length : clips.filter((c) => c.category === n).length;
    return `<button class="chip ${n === filter ? "on" : ""}" data-f="${n}">${n} ${count}</button>`;
  }).join("");
}

function render(all) {
  clips = all;
  renderFilters();
  renderTagSuggest();
  const q = $("search").value.trim().toLowerCase();
  const shown = clips.filter((c) =>
    (filter === "すべて" || (filter === "未視聴" ? !c.watched : c.category === filter)) &&
    (!q || `${c.memo} ${(c.tags || []).join(" ")} ${c.url} ${c.preview?.author || ""} ${c.preview?.text || ""}`.toLowerCase().includes(q)));
  $("list").innerHTML = shown.length ? shown.map((c) => `
    <div class="card clip ${c.watched ? "watched" : ""}" data-id="${c.id}">
      <div><span class="badge">${esc(c.category)}</span>${(c.tags || []).map((t) => `<span class="badge">#${esc(t)}</span>`).join("")}</div>
      ${previewHtml(c)}
      ${c.memo ? `<div class="memo">${esc(c.memo)}</div>` : ""}
      <div class="meta">${new Date(c.createdAt).toLocaleString("ja-JP")}${c.watched ? " ・ 視聴済み" : ""}</div>
      <div class="actions">
        <button data-act="play">▶ 再生</button>
        <a href="${esc(c.url)}" target="_blank" rel="noopener">${isInstagram(c.url) ? "Instagramで開く" : isYoutube(c.url) ? "YouTubeで開く" : "Xで開く"}</a>
        <button data-act="watched">${c.watched ? "未視聴に戻す" : "視聴済みにする"}</button>
        <button data-act="cat">分類変更</button>
        <button data-act="tags">タグ編集</button>
        <button data-act="edit">メモ編集</button>
        <button data-act="delete">削除</button>
      </div>
      <div class="cats catEdit" hidden>${CATEGORIES.map((n) =>
        `<button type="button" class="chip ${n === c.category ? "on" : ""}" data-act="setcat" data-cat="${n}">${n}</button>`).join("")}</div>
      <div class="embed"></div>
    </div>`).join("") : '<p class="empty">まだクリップがありません</p>';
  shown.filter((c) => !c.preview).forEach(backfillPreview);
}

// ---- 投稿の中身（投稿者・本文・サムネイル）を取得 ----
function previewHtml(c) {
  const p = c.preview;
  if (!p) {
    const msg = previewFailed.has(c.id)
      ? (isInstagram(c.url) ? "Instagram の投稿（▶で再生。内容はメモに書いておくと探しやすいです）" : "投稿の内容を取得できませんでした（▶で再生はできます）")
      : "投稿の内容を読み込み中…";
    return `<div class="preview" data-act="play"><div class="thumb" data-act="play"></div><div class="text note" data-act="play">${msg}</div></div>`;
  }
  return `<div class="preview" data-act="play">
      <div class="thumb" data-act="play" ${p.thumb ? `style="background-image:url('${esc(p.thumb)}')"` : ""}></div>
      <div data-act="play">
        <div class="author" data-act="play">${esc(p.author)}${p.handle ? ` <span>@${esc(p.handle)}</span>` : ""}</div>
        <div class="text" data-act="play">${esc(p.text) || "（本文なし）"}</div>
      </div>
    </div>`;
}

// まず FxTwitter（サムネイル付き）、だめなら X 公式の oEmbed（本文のみ）から取る
async function fetchPreview(url) {
  if (isInstagram(url)) {
    // Microlink（無料・キー不要）から投稿者・キャプション・サムネイルを取る
    const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
    const d = (await res.json())?.data;
    if (!d || (!d.description && !d.image?.url)) throw new Error("microlink");
    // description は「85 likes, 1 comments - handle on October 22, 2026: ”本文”.」の形。前置きと末尾を外してキャプションにする
    const m = String(d.description || "").match(/^(?:[\d,]+ likes?, [\d,]+ comments? - )?(\S+) on [^:]+: ”([\s\S]*)”\.?$/);
    return {
      author: d.author || (m ? m[1] : "Instagram"),
      handle: m ? m[1] : "",
      text: (m ? m[2] : (d.title || "")).slice(0, 280),
      thumb: d.image?.url || "",
    };
  }
  if (isYoutube(url)) {
    // サムネイルは動画 ID から決まるので通信不要。タイトルと投稿者は YouTube の oEmbed で取る（だめならサムネイルだけ）
    const id = youtubeId(url);
    const p = { author: "YouTube", handle: "", text: "", thumb: `https://i.ytimg.com/vi/${id}/hqdefault.jpg` };
    try {
      const d = await (await fetch(`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent(url)}`)).json();
      p.text = (d.title || "").slice(0, 280);
      p.author = d.author_name || p.author;
    } catch {}
    return p;
  }
  const [, handle, id] = url.match(/x\.com\/([^/]+)\/status\/(\d+)/);
  try {
    const res = await fetch(`https://api.fxtwitter.com/${handle}/status/${id}`);
    const t = (await res.json()).tweet;
    if (t) {
      const m = t.media?.all?.[0];
      return {
        author: t.author?.name || handle,
        handle: t.author?.screen_name || handle,
        text: (t.text || "").slice(0, 280),
        thumb: m?.thumbnail_url || m?.url || "",
      };
    }
  } catch {}
  const data = await new Promise((resolve, reject) => {
    const cb = `oembed_${id}`;
    const s = document.createElement("script");
    window[cb] = (d) => { delete window[cb]; s.remove(); resolve(d); };
    s.onerror = () => { delete window[cb]; s.remove(); reject(new Error("oEmbed")); };
    s.src = `https://publish.twitter.com/oembed?omit_script=1&url=${encodeURIComponent(url)}&callback=${cb}`;
    document.head.appendChild(s);
  });
  const doc = new DOMParser().parseFromString(data.html, "text/html");
  return { author: data.author_name || handle, handle, text: (doc.querySelector("p")?.textContent || "").slice(0, 280), thumb: "" };
}

const previewTried = new Set();
const previewFailed = new Set();
async function backfillPreview(c) {
  if (previewTried.has(c.id)) return;
  previewTried.add(c.id);
  try { await store.update(c.id, { preview: await fetchPreview(c.url) }); } catch (err) { console.warn("preview", err); previewFailed.add(c.id); render(clips); }
}

function loadWidgets() {
  if (window.twttr) return Promise.resolve(window.twttr);
  return new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = "https://platform.twitter.com/widgets.js";
    s.onload = () => window.twttr.ready(resolve);
    document.head.appendChild(s);
  });
}

$("list").addEventListener("click", async (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  const card = e.target.closest(".clip");
  if (!act || !card) return;
  const c = clips.find((x) => x.id === card.dataset.id);
  if (act === "play") {
    const box = card.querySelector(".embed");
    if (box.childElementCount) { box.innerHTML = ""; return; }
    if (isInstagram(c.url) || isYoutube(c.url)) {
      const f = document.createElement("iframe");
      f.src = isYoutube(c.url) ? `https://www.youtube-nocookie.com/embed/${youtubeId(c.url)}?rel=0&playsinline=1` : `${c.url}embed/`;
      f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
      f.loading = "lazy";
      f.allowFullscreen = true;
      f.style.cssText = `width:100%;${isYoutube(c.url) ? "aspect-ratio:16/9" : "height:600px"};border:0;border-radius:8px;background:#000`;
      box.appendChild(f);
      return;
    }
    box.innerHTML = `<blockquote class="twitter-tweet" data-dnt="true"><a href="${esc(c.url)}"></a></blockquote>`;
    (await loadWidgets()).widgets.load(box);
  }
  if (act === "watched") await store.update(c.id, { watched: !c.watched });
  if (act === "cat") {
    const box = card.querySelector(".catEdit");
    box.hidden = !box.hidden;
  }
  if (act === "setcat" && e.target.dataset.cat !== c.category) await store.update(c.id, { category: e.target.dataset.cat });
  if (act === "tags") {
    const input = prompt("タグ（スペース区切り）", (c.tags || []).join(" "));
    if (input !== null) await store.update(c.id, { tags: parseTags(input) });
  }
  if (act === "edit") {
    const memo = prompt("メモ", c.memo || "");
    if (memo !== null) await store.update(c.id, { memo });
  }
  if (act === "delete" && confirm("このクリップを削除しますか？")) await store.remove(c.id);
});

$("filters").addEventListener("click", (e) => {
  if (e.target.dataset.f) { filter = e.target.dataset.f; render(clips); }
});
$("search").addEventListener("input", () => render(clips));

$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = normalizeUrl($("url").value);
  if (!url) return alert("X・Instagram・YouTube のリンクを入力してください");
  if (clips.some((c) => c.url === url)) return alert("このクリップは保存済みです");
  await store.add({
    url,
    category: selectedCategory,
    tags: parseTags($("tags").value),
    memo: $("memo").value.trim(),
    watched: false,
    createdAt: Date.now(),
  });
  e.target.reset();
  selectedCategory = CATEGORIES[0];
  renderCategoryButtons();
  showForm(false);
  history.replaceState(null, "", location.pathname);
});

// ---- 起動 ----
renderCategoryButtons();
// iPhone のショートカットから ?url=... 付きで開かれたら入力欄に入れる
const params = new URLSearchParams(location.search);
const shared = params.get("url") || params.get("text");
// 共有から開いたときは保存フォームを上に、普通に開いたときは一覧を上に出す
function showForm(open) {
  $("addForm").hidden = !open;
  $("openForm").hidden = open;
}
$("closeForm").addEventListener("click", () => { showForm(false); history.replaceState(null, "", location.pathname); });
// コピーしてあるリンク（X / Instagram）があれば入力欄に入れる。iPhone では「ペースト」の確認が出る
async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    const m = text.match(/https?:\/\/\S+/);
    if (m && normalizeUrl(m[0])) { $("url").value = m[0]; return true; }
  } catch {}
  return false;
}
$("openForm").addEventListener("click", async () => {
  showForm(true);
  if (!$("url").value && (await pasteFromClipboard())) return;
  $("url").focus();
});
$("pasteBtn").addEventListener("click", async () => {
  if (!(await pasteFromClipboard())) alert("コピーしたリンクが見つかりませんでした。先に X か Instagram でリンクをコピーしてください");
});
if (shared) { $("url").value = (shared.match(/https?:\/\/\S+/) || [shared])[0]; showForm(true); }

const synced = Boolean(firebaseConfig.apiKey);
$("mode").textContent = synced ? "同期モード" : "この端末のみ";
try {
  store = synced ? await firebaseStore() : localStore;
} catch (err) {
  // 通信できずに同期の仕組みを読み込めなかったときは、この端末のみで動かす
  console.error(err);
  $("mode").textContent = "同期できません（この端末のみ）";
  store = localStore;
}
store.subscribe(render);
</script>
</body>
</html>
